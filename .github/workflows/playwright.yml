
name: Playwright Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.browser }} Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Smoke Tests
        if: github.event_name == 'push'
        run: npm run test:smoke -- --project=${{ matrix.browser }}

      - name: Run Regression Tests
        if: github.event_name != 'push'
        run: npm run test:regression -- --project=${{ matrix.browser }}

      - name: Upload Blob Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blob-report-${{ matrix.browser }}
          path: blob-report/
          retention-days: 30
          if-no-files-found: ignore

  merge-reports:
    name: Merge Playwright Reports
    if: always()
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Blob Reports
        uses: actions/download-artifact@v6
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge Reports into HTML
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Combined HTML Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: combined-playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore
