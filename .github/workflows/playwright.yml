
name: Playwright Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      test_slack_notification:
        description: 'Send a test Slack notification'
        required: false
        type: boolean
        default: false

  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.browser }} Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Smoke Tests
        if: github.event_name == 'push'
        run: npm run test:smoke -- --project=${{ matrix.browser }}

      - name: Run Regression Tests
        if: github.event_name != 'push'
        run: npm run test:regression -- --project=${{ matrix.browser }}

      - name: Upload Blob Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blob-report-${{ matrix.browser }}
          path: blob-report/
          retention-days: 30
          if-no-files-found: ignore

  merge-reports:
    name: Merge Playwright Reports
    if: always()
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Blob Reports
        uses: actions/download-artifact@v6
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge Reports into HTML
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Combined HTML Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: combined-playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

  deploy-pages:
    name: Deploy Playwright Report
    needs: [test, merge-reports]
    if: needs.test.result == 'success' && needs.merge-reports.result == 'success'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Combined HTML Report
        uses: actions/download-artifact@v6
        with:
          name: combined-playwright-report
          path: playwright-report

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: playwright-report/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-slack:
    name: Notify Slack on Failure
    runs-on: ubuntu-latest
    needs: [test, merge-reports, deploy-pages]
    if: ${{ always() && (contains(needs.*.result, 'failure') || inputs.test_slack_notification) }}

    steps:
      - name: Send Slack Failure Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -n \
            --arg workflow "$WORKFLOW" \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg run_url "$RUN_URL" \
            '{
              text: "🚨 Playwright CI/CD Failure",
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: "*🚨 Playwright Tests Failed*\n\n*Workflow:* \($workflow)\n*Repository:* \($repository)\n*Branch:* \($branch)\n\n<\($run_url)|View GitHub Actions Run>"
                  }
                }
              ]
            }')

          curl --fail --show-error --silent \
            -X POST \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
